[package]
name = "verryte-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terminal-cell primitives for Verryte: Color, Cell, Grid, layered composition, plain renderer."

[lints]
workspace = true

[dependencies]
image = { version = "0.24", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
verryte-core = { path = "../verryte-core" }
verryte-map = { path = "../verryte-map" }

[[bin]]
name = "bake_sprite"
path = "src/bin/bake_sprite.rs"
required-features = ["image"]

[features]
default = ["image"]
serde = ["dep:serde", "dep:serde_json"]
